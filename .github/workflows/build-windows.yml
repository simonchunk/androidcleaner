name: Build Windows Android Cleaner

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Android build tools on runner
        shell: powershell
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (!(Test-Path $sdkmanager)) {
            $sdkmanager = (Get-ChildItem -Path (Join-Path $env:ANDROID_HOME 'cmdline-tools') -Filter sdkmanager.bat -Recurse | Select-Object -First 1).FullName
          }
          if (!$sdkmanager -or !(Test-Path $sdkmanager)) { throw 'sdkmanager.bat not found on GitHub Windows runner' }
          & $sdkmanager 'platform-tools' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed with exit code $LASTEXITCODE" }

      - name: Build Android Cleaner
        shell: powershell
        run: |
          pyinstaller --clean --noconfirm AndroidCleaner.spec

      - name: Package app and Android tools
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          New-Item -ItemType Directory -Force package\platform-tools | Out-Null
          New-Item -ItemType Directory -Force package\build-tools | Out-Null

          Copy-Item dist\AndroidCleaner.exe package\AndroidCleaner.exe
          Copy-Item risk_rules.json,knowledge_seed.json,device_models.json,production_config.json package\

          Copy-Item "$env:ANDROID_HOME\platform-tools\adb.exe" package\platform-tools\adb.exe
          Copy-Item "$env:ANDROID_HOME\platform-tools\AdbWinApi.dll" package\platform-tools\AdbWinApi.dll
          Copy-Item "$env:ANDROID_HOME\platform-tools\AdbWinUsbApi.dll" package\platform-tools\AdbWinUsbApi.dll
          Copy-Item "$env:ANDROID_HOME\build-tools\36.0.0\aapt2.exe" package\build-tools\aapt2.exe

          if (!(Test-Path package\platform-tools\adb.exe)) { throw 'adb.exe was not packaged' }
          if (!(Test-Path package\build-tools\aapt2.exe)) { throw 'aapt2.exe was not packaged' }

          Compress-Archive -Path package\* -DestinationPath AndroidCleaner-v0.18.2-Windows.zip -Force
          (Get-FileHash AndroidCleaner-v0.18.2-Windows.zip -Algorithm SHA256).Hash.ToLower() + '  AndroidCleaner-v0.18.2-Windows.zip' | Set-Content AndroidCleaner-v0.18.2-Windows.zip.sha256

      - name: Show package contents
        shell: powershell
        run: |
          Get-ChildItem -Recurse package

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCleaner-v0.18.2-Windows
          path: |
            AndroidCleaner-v0.18.2-Windows.zip
            AndroidCleaner-v0.18.2-Windows.zip.sha256
          if-no-files-found: error
