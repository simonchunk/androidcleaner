name: Build Windows Android Cleaner Installer

on:
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read application version
        id: app_version
        shell: powershell
        run: |
          $source = Get-Content android_cleaner.py -Raw
          $match = [regex]::Match($source, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (!$match.Success) { throw 'APP_VERSION not found in android_cleaner.py' }
          $version = $match.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Building Android Cleaner v$version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Android tools on runner
        shell: powershell
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (!(Test-Path $sdkmanager)) {
            $sdkmanager = (Get-ChildItem -Path (Join-Path $env:ANDROID_HOME 'cmdline-tools') -Filter sdkmanager.bat -Recurse | Select-Object -First 1).FullName
          }
          if (!$sdkmanager -or !(Test-Path $sdkmanager)) { throw 'sdkmanager.bat not found on GitHub Windows runner' }
          & $sdkmanager 'platform-tools' 'build-tools;36.0.0' 'platforms;android-36'
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed with exit code $LASTEXITCODE" }

      - name: Build Android on-device icon helper
        shell: powershell
        run: |
          if (!(Test-Path 'IconFetcher.java')) { throw 'IconFetcher.java must be in the repository root' }
          New-Item -ItemType Directory -Force icon-helper-build\classes | Out-Null
          $androidJar = Join-Path $env:ANDROID_HOME 'platforms\android-36\android.jar'
          if (!(Test-Path $androidJar)) { throw 'android.jar not found' }
          javac -source 8 -target 8 -cp $androidJar -d icon-helper-build\classes IconFetcher.java
          if ($LASTEXITCODE -ne 0) { throw "javac failed with exit code $LASTEXITCODE" }
          $d8 = Join-Path $env:ANDROID_HOME 'build-tools\36.0.0\d8.bat'
          if (!(Test-Path $d8)) { throw 'd8.bat not found' }
          & $d8 --min-api 26 --output icon-helper-build\icon-helper.jar icon-helper-build\classes\IconFetcher.class
          if ($LASTEXITCODE -ne 0) { throw "d8 failed with exit code $LASTEXITCODE" }
          if (!(Test-Path 'icon-helper-build\icon-helper.jar')) { throw 'icon-helper.jar was not built' }

      - name: Build self-contained Android Cleaner EXE
        shell: powershell
        run: |
          pyinstaller --clean --noconfirm AndroidCleaner.spec
          if (!(Test-Path 'dist\AndroidCleaner.exe')) { throw 'AndroidCleaner.exe was not built' }

      - name: Stage application and bundled Android tools
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          New-Item -ItemType Directory -Force package\platform-tools | Out-Null
          New-Item -ItemType Directory -Force package\build-tools | Out-Null

          Copy-Item dist\AndroidCleaner.exe package\AndroidCleaner.exe
          Copy-Item risk_rules.json,knowledge_seed.json,device_models.json,production_config.json package\
          Copy-Item "$env:ANDROID_HOME\platform-tools\adb.exe" package\platform-tools\adb.exe
          Copy-Item "$env:ANDROID_HOME\platform-tools\AdbWinApi.dll" package\platform-tools\AdbWinApi.dll
          Copy-Item "$env:ANDROID_HOME\platform-tools\AdbWinUsbApi.dll" package\platform-tools\AdbWinUsbApi.dll
          Copy-Item "$env:ANDROID_HOME\build-tools\36.0.0\aapt2.exe" package\build-tools\aapt2.exe
          Copy-Item icon-helper-build\icon-helper.jar package\icon-helper.jar
          New-Item -ItemType Directory -Force package\assets | Out-Null
          Copy-Item tig_red_brand.png package\assets\tig_red_brand.png

          if (!(Test-Path 'package\platform-tools\adb.exe')) { throw 'adb.exe was not staged' }
          if (!(Test-Path 'package\build-tools\aapt2.exe')) { throw 'aapt2.exe was not staged' }
          if (!(Test-Path 'package\icon-helper.jar')) { throw 'icon-helper.jar was not staged' }

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler was not installed' }

      - name: Build Windows installer
        shell: powershell
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $expected = "The-iPhone-Guy-Android-Cleaner-Setup-v$env:APP_VERSION.exe"
          $setup = Get-ChildItem -Path 'installer-output' -Filter $expected -File | Select-Object -First 1
          if (!$setup) { throw "Installer EXE was not created: $expected" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content "$($setup.FullName).sha256"

      - name: Show installer output
        shell: powershell
        run: |
          Get-ChildItem -Recurse installer-output

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCleaner-v${{ steps.app_version.outputs.version }}-Installer
          path: |
            installer-output/The-iPhone-Guy-Android-Cleaner-Setup-v${{ steps.app_version.outputs.version }}.exe
            installer-output/The-iPhone-Guy-Android-Cleaner-Setup-v${{ steps.app_version.outputs.version }}.exe.sha256
          if-no-files-found: error
